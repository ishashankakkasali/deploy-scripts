# The database migration: Protocol and Matcher baselined at Flyway version 1, so V1 is skipped (the
# 1.x tables exist) and V2+ reshape them. Add it after your own compose files in COMPOSE_FILES
# (migration-local.env). The replay does not use it: there the 2.0 services build every table from V1.
services:
  cce-protocol-service:
    environment:
      CCE_FLYWAY_BASELINE_VERSION: "1"
  cce-matcher-service:
    environment:
      CCE_FLYWAY_BASELINE_VERSION: "1"
